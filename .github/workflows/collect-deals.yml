# ─── Run collection script every 6 hours ─────────────────────────
name: Refresh Deals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: # manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect startup deals
        run: npx tsx scripts/collect-deals.ts
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "DealBot"
          git config user.email "dealbot@startup-deals.fyi"
          git add -A
          git diff --staged --quiet || git commit -m "chore: refresh startup deals [automated]"
          git push